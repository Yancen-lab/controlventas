name: Crear APK Android

on:
  push:
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v7


      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"


      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            sudo \
            unzip \
            wget \
            zip


      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer


      - name: Construir APK
        run: |
          buildozer -v android debug


      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlVentas-APK
          path: bin/*.apk
          if-no-files-found: error
