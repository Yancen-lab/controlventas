name: Crear APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Construir APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: stable

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlVentas-APK
          path: bin/*.apk
